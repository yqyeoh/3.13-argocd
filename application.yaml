apiVersion: argoproj.io/v1alpha1
kind: Application
# test sync for yq-app in yq-ns namespace
metadata:
  name: yq-app
spec:
  project: default
  source:
    repoURL: "https://github.com/yqyeoh/3.13-argocd.git"
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: yq-ns
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true