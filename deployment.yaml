apiVersion: apps/v1
kind: Deployment
metadata:
  name: yq-app
  namespace: yq-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yq-app
  template:
    metadata:
      labels:
        app: yq-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80